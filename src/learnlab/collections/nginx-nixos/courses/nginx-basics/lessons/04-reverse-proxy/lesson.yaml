id: reverse-proxy
title: Configure a Reverse Proxy
steps:
- id: add-a-proxying-virtual-host
  title: Proxy one virtual host to another
  instructions: |-
    Add a second virtual host that proxies to the one from the previous
    lesson, and turn on the module's recommended proxy headers globally
    so you do not have to write proxy_set_header lines by hand:

      services.nginx.recommendedProxySettings = true;
      services.nginx.virtualHosts."learnlab-proxy.local" = {
        listen = [ { addr = "0.0.0.0"; port = 8081; } ];
        locations."/".proxyPass = "http://127.0.0.1:8080";
      };

    Run `sudo -n timeout 300 nixos-rebuild switch`, then confirm from the VM with
    `curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8081/`.
    Add to the existing learnlab-content.local host:
    services.nginx.virtualHosts."learnlab-content.local".locations."/learnlab-probe".extraConfig = ''
      default_type text/plain;
      return 200 "$arg_token|$http_x_forwarded_for";
    '';
    Apply the edited configuration again before verification. The diagnostic upstream echoes a fresh token and the forwarded client header; it is for this disposable lab only.
  verifications:
  - id: proxy-forwards-body-and-header
    type: remote-command
    command: set -eu; probe=$(mktemp /tmp/learnlab-proxy.XXXXXX); trap 'rm -f "$probe"' EXIT; token=${probe##*/};
      test "$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:8080/learnlab-probe?token=$token")"
      = "$token|"; test "$(curl --fail --silent --show-error --max-time 5 "http://127.0.0.1:8081/learnlab-probe?token=$token")"
      = "$token|127.0.0.1"
    failure_message: The direct upstream must return the new token without a forwarded address; the proxy
      must return it with 127.0.0.1.
  - id: nginx-proxy-listener
    type: remote-command
    command: sudo -n timeout 10 nginx -T >/dev/null && sudo -n timeout 10 ss -ltnp 'sport = :8081' | grep
      -q '"nginx"'
    failure_message: nginx must own port 8081 and its configuration must parse.
- id: explain-why-headers-matter
  title: Explain why forwarding headers matter
  instructions: Without those headers, every request the upstream virtual host sees appears to originate
    from the proxy's own loopback address, which breaks access logs, rate limiting, and any logic based
    on the client's real address.
  verifications:
  - id: explain-forwarded-headers
    type: text-evidence
    prompt: If a reverse proxy does not forward the client's real address, what address does the upstream
      server see instead?
    matches: (?i)^\s*(?:the )?proxy(?:\x27s)? (?:own )?(?:loopback )?(?:IP )?address(?:,? 127\.0\.0\.1)?[.!]?\s*$
