id: allowing-a-service
title: Allow an Additional Service
steps:
- id: declare-a-test-listener
  title: Declare something to test your rule against
  instructions: |-
    Add a small declarative systemd service to configuration.nix so you
    have a real, persistent listener to open a port for:

      systemd.services.test-listener = {
        description = "LearnLab firewall test listener";
        wantedBy = [ "multi-user.target" ];
        serviceConfig = {
          ExecStart = "${pkgs.python3}/bin/python3 -m http.server 8080";
          Restart = "always";
        };
      };

    Run `sudo timeout --kill-after=10 900 nixos-rebuild build`. After building, use the lesson 2 snapshot timer and bounded activation command; recheck SSH and cancel only after success.
  verifications:
  - id: test-listener-declared
    type: remote-command
    command: grep -q 'test-listener' /etc/nixos/configuration.nix
    failure_message: configuration.nix does not declare a test-listener service yet.
  - id: test-listener-active
    type: remote-command
    command: systemctl is-active --quiet test-listener
    failure_message: test-listener.service is not active.
  - id: test-listener-reachable-on-loopback
    type: remote-command
    command: curl --noproxy '*' --fail --silent --show-error --max-time 3 -o /dev/null -w '%{http_code}'
      http://127.0.0.1:8080/ | grep -qx 200
    failure_message: The test listener did not respond on 127.0.0.1:8080.
- id: allow-the-port-and-explain-loopback
  title: Allow the port, and understand why loopback isn't proof
  instructions: Add `tcp dport 8080 accept` once to the input chain inside the ruleset string. First run
    `sudo timeout --kill-after=10 900 nixos-rebuild build` and stop if it fails. Only after a successful
    build, arm and verify the lesson 2 snapshot timer. Then activate with `sudo timeout --kill-after=5
    60 ./result/bin/switch-to-configuration switch`. Verify a new SSH connection before canceling the
    timer. Notice that curling 127.0.0.1:8080 already worked before this rule existed, because `iifname
    "lo" accept` accepts all loopback traffic unconditionally regardless of destination port. Testing
    over loopback proves the listener works; it does not prove your new port-8080 rule does anything at
    all. Preserve all previous input rules and insert the service rule once. Use the checked snapshot
    timer and bounded activation procedure from lesson 2; verify a new SSH connection before canceling.
  verifications:
  - id: port-8080-allowed
    type: remote-command
    command: sudo -n nft list chain inet filter input | grep -Ex '[[:space:]]*tcp dport 8080 accept[[:space:]]*'
    failure_message: The active input chain does not have the required rule or policy. Check the complete
      persisted ruleset, validate/build it, and use the verified snapshot timer before activation.
  - id: explain-loopback-caveat
    type: text-evidence
    prompt: 'Why doesn''t successfully curling 127.0.0.1:8080 prove that your new "tcp dport 8080 accept"
      rule is doing anything? Reply exactly: loopback is accepted before the port rule'
    matches: (?i)^loopback\ is\ accepted\ before\ the\ port\ rule[.]?$
