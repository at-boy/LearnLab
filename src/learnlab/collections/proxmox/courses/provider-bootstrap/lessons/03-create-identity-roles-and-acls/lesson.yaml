id: create-identity-roles-and-acls
title: Create Identity, Roles, and ACLs
steps:
  - id: inventory-before-change
    title: Confirm administrator authority and an exact rollback record
    instructions: |
      Proxmox node: Prerequisite: complete the authority map and explicit /vms limitation acceptance. The existing authorized bootstrap administrator must independently confirm permission to create the planned access objects. If you lack that existing authority, stop and hand the private worksheet to that administrator; this course does not authorize self-escalation.
      Proxmox node: Resume/reinspection: after any interruption, refresh authorized users, tokens, roles, ACLs, effective permissions, and resource inventory. Compare each exact object with its recorded before state; never restart the whole creation sequence blindly.
      Proxmox node: Before each command family, inspect installed syntax and permission metadata. Read-only examples for the administrator's separate shell are `pveum help`, `pveum role list --output-format json`, and `pveum acl list --output-format json`. Confirm these shapes in installed help first. Keep all output private; do not copy a full listing into the worksheet or LearnLab.
      Proxmox node: Record privately each intended object, path, role, explicit propagate flag, exact before state, expected result, and reverse action. Record only selected non-secret fields needed for reconciliation. Verify absence through refreshed, authorized inventory before every create. An existing object or collision is never permission to overwrite, adopt, or delete it.
      Proxmox node: User.Modify is an installed-version/live-confirmation-required candidate reserved for the already-authorized bootstrap administrator at the installed access-control scope. Permissions.Modify is an installed-version/live-confirmation-required candidate reserved for that administrator for roles and ACLs. Neither belongs to the runtime user or token.
      Proxmox node: Expected outcome: an approved itemized change/rollback worksheet and verified installed syntax. Starting or completing this NONE-scope course executes no commands and grants no authority; the administrator deliberately performs each separately confirmed change outside LearnLab.
      Proxmox node: Stop condition: a 403, filtered or incomplete list, missing privilege, extra inheritance, unexpected object, or uncertain before state stops the sequence. Troubleshooting: reconcile exact identity, scope, propagation, and visibility with authorized inventory; never treat denied output as absence.
    verifications:
      - id: access-change-preflight-self-attestation
        type: manual-confirmation
        prompt: 'Self-attestation: confirm existing administrator authority, refreshed private inventory, and an itemized before-state and reverse-action worksheet without submitting output or identifiers.'
  - id: create-dedicated-identities
    title: Create a dedicated user and one separated token
    instructions: |
      Proxmox node: Explicit checkpoint: the authorized administrator confirms only the planned dedicated non-human user and one token, after successful absence checks and installed user/token help inspection. Do not borrow a human administrator identity or attach runtime access to a shared user.
      Proxmox node: Parameterized, non-executable command shapes are `pveum <installed user-create subcommand> <DEDICATED_USER> <verified options>` and `pveum <installed token-create subcommand> <DEDICATED_USER> <TOKEN_NAME> <verified privilege-separation and secure-delivery options>`. Resolve the syntax from installed help and the private worksheet before any use. These shapes intentionally contain no cluster identity or runnable mutation command.
      Proxmox node: Create the user first and inspect the exact resulting identity and memberships. Expected result: one intended dedicated user with no unexpected group or inherited grant. Record the confirmed non-secret result privately before the token operation.
      Proxmox node: Before creating the token, arrange an approved external hidden mechanism to capture its one-time secret directly and privately. Disable shell tracing and terminal recording; never send the secret to ordinary command output, shell history, process arguments, repository, TOML, SQLite, logs, exceptions, screenshots, snapshots, approval transcripts, or LearnLab answers. If the installed workflow cannot deliver the secret without exposing it, stop and have the administrator establish a secure delivery method first.
      Proxmox node: Create exactly one privilege-separated token and inspect token metadata without its secret. Expected result: the planned user/token association and privsep=1, with no extra token. Store the secret only in the approved external hidden mechanism; the private worksheet contains no secret. Later the controller supplies it through the profile's named environment variable; LearnLab has no token-secret stdin or interactive-prompt interface.
      Proxmox node: Stop condition and troubleshooting: an unexpected identity, missing privsep=1, 403, duplicate token, lost one-time secret, or partial mutation stops further work. Re-inventory the exact object and secure any uncertain credential through the administrator; do not create more tokens or switch to an unseparated token to bypass the problem. Record a verified reverse action, and retain any cleanup authority until independent reconciliation proves it safe to revoke.
    verifications:
      - id: dedicated-token-self-attestation
        type: manual-confirmation
        prompt: 'Self-attestation: confirm the administrator verified the dedicated identity and privsep=1, and captured the secret only through the approved external hidden mechanism without entering it here.'
  - id: create-custom-roles
    title: Create and inspect narrowly composed custom roles
    instructions: |
      Proxmox node: Explicit checkpoint: inspect installed role help and current role definitions, confirm each proposed name is absent, and approve one custom role at a time from the private resource matrix. A role that already exists requires exact reconciliation; do not modify it merely because its name matches the plan.
      Proxmox node: The parameterized, non-executable shape is `pveum <installed role-create subcommand> <CUSTOM_ROLE> <verified exact privilege-list options>`. After each creation, re-list that role and compare its stored privilege set with the worksheet before continuing. Expected result: the exact selected definition, no extra privilege, and a privately recorded reverse action.
      Proxmox node: Keep runtime source-template clone, propagated target lifecycle, target storage, network leaf use, and proven node/task needs in separate roles. Every runtime candidate from the previous lesson remains installed-version/live-confirmation-required until separately authorized live proof; successfully creating a role is not that proof.
      Proxmox node: PVE 9.2.11 development observation only, not a portable default: built-in PVEDatastoreAdmin contained Datastore.Allocate. That was too broad for human template-builder storage. The live discovery used a custom role containing only Datastore.AllocateSpace, Datastore.AllocateTemplate, and Datastore.Audit at one storage leaf. Those candidate names are installed-version/live-confirmation-required on your system.
      Proxmox node: In the same non-portable observation a separated token with PVEAuditor at that storage leaf remained limited to Datastore.Audit (installed-version/live-confirmation-required). This illustrates the user/token intersection; it does not establish a sufficient runtime role. The runtime clone-storage role is a separate installed/live-confirmed surface, not a reason to inherit the human template-builder storage role.
      Proxmox node: Built-in PVEVMAdmin was broad in that development environment, including VM configuration, console, guest-agent file and unrestricted actions beyond this adapter. PVEAuditor and any other built-in name also require inspection; none proves least privilege by its name.
      Proxmox node: Do not assign Administrator or PVEAdmin as a workaround. Do not use broad PVEVMAdmin or an unseparated token as a fallback. Do not add Datastore.Allocate to resolve denial; human template-builder storage and runtime clone-storage remain separate.
      Proxmox node: Stop condition and troubleshooting: a role with extra/missing privileges, a conflicting existing role, unexpected built-in definition, 403, or filtered output stops creation. Reconcile stored definitions and effective scope rather than submitting a broader role. Never alter a shared role to fit this bootstrap.
    verifications:
      - id: custom-role-review-self-attestation
        type: manual-confirmation
        prompt: 'Self-attestation: confirm that the administrator inspected each created role against the private matrix, kept human and runtime storage roles separate, and used no broad fallback.'
  - id: apply-acls-one-scope-at-a-time
    title: Add user and token ACLs with explicit propagation
    instructions: |
      Proxmox node: Explicit checkpoint: refresh the exact ACL path and its inheritance before each addition. Confirm the intended principal, custom role, propagate flag, before state, expected result, and reverse action. A duplicate entry or unexpected existing authority stops the change for reconciliation.
      Proxmox node: Parameterized, non-executable shapes are `pveum <installed ACL-add subcommand> <RESOURCE_PATH> <verified user selector> <CUSTOM_ROLE> <explicit propagation options>` and the corresponding shape with `<verified token selector>`. Installed help defines actual arguments. Apply the user ACL, inspect it, then apply the token ACL and inspect it before moving to another resource scope.
      Proxmox node: Work through the source-template leaf, the explicitly accepted propagated /vms target scope, the exact storage leaf, the installed bridge/network path, and only the node/task scope shown necessary. Keep the propagate choice explicit on every row; a leaf grant does not justify propagation from a broader parent. Confirm the resulting role, path, principal, and flag after every addition.
      Proxmox node: Expected outcome: both identities have only the intended grants, with recorded before/after state and a precise reversal for each ACL. A user-only grant cannot prove the privilege-separated token has the same right, and a token-only grant cannot exceed the user's authority.
      Proxmox node: Stop condition and troubleshooting: extra inheritance, a missing privilege, 403, filtered results, a mismatched propagate flag, or any partial mutation stops the sequence immediately. Re-inventory the exact user and token grants separately, compare with the worksheet, and resume only from positively confirmed state. Do not retry the entire ACL sequence or add a broad role to diagnose it.
    verifications:
      - id: scoped-acl-self-attestation
        type: manual-confirmation
        prompt: 'Self-attestation: confirm that each user and token ACL was inspected one resource scope at a time with an explicit propagation flag and private reverse action.'
  - id: reconcile-effective-authority
    title: Reconcile effective authority before profile entry
    instructions: |
      Proxmox node: Inspect installed effective-permission query syntax. Use the parameterized shapes `pveum <installed user-permissions subcommand> <DEDICATED_USER> <verified scope options>` and `pveum <installed token-permissions subcommand> <DEDICATED_USER> <TOKEN_NAME> <verified scope options>` only after resolving them from installed help. Keep query output private.
      Proxmox node: Compare effective permissions for the user and token separately at every intended resource path, including inherited grants and propagation. Expected result: exact worksheet privileges for each identity, with effective token authority limited to their intersection. Resolve every extra or missing privilege, unexpected group/role inheritance, or ambiguous path before profile entry. The comparison is an administrator inspection, not proof that all runtime requests succeed.
      Proxmox node: A 403, filtered result, partial mutation, or mismatch stops the sequence for exact reconciliation; it never triggers Administrator, PVEAdmin, broad PVEVMAdmin, an unseparated token, or Datastore.Allocate fallback. Use refreshed authorized inventory to distinguish absence from denial and compare each object with its recorded before state.
      Proxmox node: Preserve the worksheet and cleanup permissions if any managed or scratch resource remains, might remain, or has an unresolved task. Never revoke cleanup authority on the strength of a missing VM row, a 404, local progress, or this lesson's completion. Before any rollback, an administrator other than the runtime token must independently confirm positive cleanup against the worksheet, protected ownership state, authorized inventory, task status, and storage artifacts, with the source template still present.
      Proxmox node: After positive cleanup, explicitly choose retention for future use or revocation. For revocation, disable or delete only this bootstrap's token first; then unwind the created access dependencies in reverse order: remove only the recorded ACL entries, remove the dedicated user only after proving no remaining ownership or use, and remove custom roles only after proving no remaining ACL or user references. Re-inventory after each operation. Use the private before state and reverse actions; never remove shared users, roles, ACLs, templates, storage, networks, or unrelated VMs. Unexpected references or denied/filtered queries stop rollback for administrator review.
      Proxmox node: Troubleshooting: preserve evidence and inspect the exact partially changed object before continuing or reversing it. If safe reversal cannot be established, leave the sequence paused for administrator reconciliation; do not broaden authority or remove permissions needed for recovery. Record only a generic self-attestation in LearnLab, never query output, identities, paths, or secrets.
    verifications:
      - id: token-authority
        type: text-evidence
        prompt: 'What combines the dedicated user and privilege-separated token permissions? Enter intersection.'
        equals: intersection
        failure_message: Effective privilege-separated token authority is the intersection of user and token permissions.
