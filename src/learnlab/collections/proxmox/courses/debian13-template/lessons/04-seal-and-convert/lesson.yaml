id: seal-and-convert
title: Seal and Convert the Debian Candidate
steps:
  - id: inspect-candidate
    title: Identify the candidate and a recoverable source
    instructions: |
      Proxmox node (management UI): prerequisite is the installed Debian 13
      guest with tested console, key SSH, sudo, tools and agent. On resume,
      inspect the actual node, VMID, name, disk/storage, template flag, power
      state and snapshots against your private owner-only worksheet. A VMID
      alone proves no ownership. Never alter an existing working template or
      a template used by another profile. Keep a recoverable original/source
      until the new candidate passes two-clone acceptance. If none exists,
      make a separate backup or full source clone before sealing, budget its
      storage and verify its ownership and recoverability. Conversion requires
      a stopped candidate without snapshots.
      Inspect the candidate's snapshot tree now. If snapshots exist, stop and
      decide how to preserve the source; do not delete them automatically or
      force conversion. If the candidate is already a template, do not seal
      or convert it again. If partially sealed or unexpectedly running, inspect
      the guest state and restore from the known source when uncertain. A boot
      after sealing invalidates the sealed state; inspect before repeating it.
    verifications:
      - id: candidate-ownership-checked
        type: manual-confirmation
        prompt: Confirm exact candidate ownership, recoverable source, power/template state and snapshot plan locally.
  - id: configure-missing-host-keys
    title: Make missing SSH host keys regenerate before SSH starts
    instructions: |
      Installed guest (administrator console): inspect `systemctl cat ssh.service`,
      `systemctl cat ssh.socket`, `systemctl is-enabled ssh.socket` and
      `systemctl list-sockets` (an absent ssh.socket is fine). Also inspect
      `sshd -T` hostkey paths and existing `/etc/ssh/ssh_host_*_key` file types,
      ownership and mounts with `stat`, `findmnt -T /etc/ssh`, and `ls -l`.
      If paths are symlinks, mounts, unexpected types or customized keys,
      stop and resolve their ownership instead of applying generic cleanup.
      The Debian trixie `ssh-keygen -A` command creates only missing default
      host keys. As root, use an interactive editor to create
      `/etc/systemd/system/learnlab-ssh-host-keys.service` with exactly:

      [Unit]
      Description=Generate missing Debian SSH host keys before ssh.service
      Before=ssh.service

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/ssh-keygen -A
      TimeoutStartSec=30s
      RemainAfterExit=yes

      Create `/etc/systemd/system/ssh.service.d/10-learnlab-host-keys.conf`:

      [Unit]
      Requires=learnlab-ssh-host-keys.service
      After=learnlab-ssh-host-keys.service

      Set both files root:root mode 0644. Run `systemctl daemon-reload`,
      obtain the actual path from `systemctl show ssh.service -p FragmentPath`,
      then run `systemd-analyze verify` on the new unit and that actual path;
      inspect `systemctl cat ssh.service`
      and `systemctl show ssh.service -p Requires -p After`. Resolve warnings
      or missing dependency before proceeding. There is deliberately no
      `ConditionFirstBoot=yes`: an empty machine-id file is not systemd's
      first-boot condition. While the original keys still exist, run
      `systemctl start learnlab-ssh-host-keys.service` and compare the existing
      host public-key fingerprints before/after locally; they must be unchanged.
      If ssh.socket is active/enabled, inspect its triggers and stop/disable
      that socket before sealing; its activation must not bypass the key unit.
      Keep the guest console available. Do not delete any key yet.
    verifications:
      - id: key-regeneration-order-checked
        type: manual-confirmation
        prompt: Confirm unit syntax, ssh.service dependency, socket ordering and preservation of existing keys locally.
  - id: first-boot-concept
    title: Check Debian machine-id first-boot semantics
    instructions: |
      Installed guest: an empty /etc/machine-id causes systemd to generate
      and commit an identity, but does not trigger ConditionFirstBoot=yes.
      The SSH missing-key unit must therefore run through its explicit
      ssh.service dependency rather than a first-boot condition.
    verifications:
      - id: empty-machine-id-first-boot
        type: text-evidence
        prompt: 'Does an existing empty /etc/machine-id trigger ConditionFirstBoot=yes? Enter yes or no.'
        equals: 'no'
        failure_message: An empty file gets a new ID but does not count as first boot.
  - id: generalize-identities
    title: Stop access and generalize only inspected identities
    instructions: |
      Installed guest (administrator console): before mutation, inspect
      `findmnt -T /etc/machine-id`, `stat -c '%F %n' /etc/machine-id`,
      `ls -l /var/lib/dbus/machine-id`, `readlink /var/lib/dbus/machine-id`
      if it is a symlink, and `findmnt -T /var/lib/dbus/machine-id`.
      Confirm normal writable guest filesystems and ordinary files. A D-Bus
      symlink to /etc/machine-id should remain a symlink; a separate stale
      regular D-Bus ID must be removed or emptied after confirming its type,
      because systemd can use it when /etc/machine-id is empty. Other types,
      mount points or unexpected targets are stop conditions. Inspect the
      actual DHCP client with `systemctl status systemd-networkd NetworkManager
      networking`, `ps -ef` and its active configuration/logs. If ifupdown
      runs dhclient, inspect `/etc/network/interfaces`, dhclient config and
      `/var/lib/dhcp/` lease files; identify only leases for this interface
      before clearing them individually. For NetworkManager, inspect its
      connection's DHCP ID policy and per-connection lease state; for
      systemd-networkd, inspect ClientIdentifier policy and runtime leases.
      Clear only proven persistent per-machine state for the active client;
      do not paste a generic lease-deletion recipe. Verify clone DHCP
      identities later.

      Explicitly confirm the exact candidate, the recovery source and all
      individual files on the console. Stop `ssh.socket` if present and
      `ssh.service`; check neither can restart before shutdown. For only the
      validated ordinary `/etc/ssh/ssh_host_*_key` private/public pairs,
      remove each inspected pair individually with root privileges. Do not
      touch authorized_keys or controller keys. For a validated ordinary
      `/etc/machine-id`, use `: > /etc/machine-id` as root and confirm it is
      empty. For a separately validated regular `/var/lib/dbus/machine-id`,
      empty that file as root too; leave a verified symlink to /etc/machine-id
      intact. Reinspect types, emptiness and absence of only selected host
      keys. Power off from this console with `systemctl poweroff`. Do not
      reboot, start SSH or boot the sealed candidate before conversion.
      If interrupted, inspect actual power, template and file states before
      any repeat; a running guest can regenerate identity and invalidate seal.
    verifications:
      - id: sealed-poweroff-checked
        type: manual-confirmation
        prompt: Confirm inspected identity paths, SSH stopped and the sealed candidate powered off without reboot.
  - id: convert-inspected-candidate
    title: Convert only the stopped snapshot-free candidate
    instructions: |
      Proxmox node (management UI): inspect the exact VMID/name/node/disk
      against the private worksheet again. Verify stopped state, no snapshots,
      no template flag and retained recovery source. Confirm conversion of
      this candidate explicitly in the UI; do not use force flags. Expected:
      Proxmox shows the chosen candidate as a template, still stopped, and
      the source remains available. If conversion fails, read the actual task
      error (a snapshot blocker is not a reason to delete snapshots), inspect
      state and stop. Do not boot the template to investigate; preserve it
      for the two full-clone test. No LearnLab command performs conversion.
    verifications:
      - id: template-conversion-checked
        type: manual-confirmation
        prompt: Confirm only the chosen stopped snapshot-free candidate became a template and the source remains recoverable.
