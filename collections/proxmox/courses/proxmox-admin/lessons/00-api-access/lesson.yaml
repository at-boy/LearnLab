id: api-access
title: Understand API Access
steps:
  - id: understand-api
    title: Understand the API boundary
    instructions: >-
      An API lets a program request information or actions through a defined
      interface. Treat it as a deliberate boundary with its own permissions,
      audit trail, and documentation.
    verifications:
      - id: api-release
        type: remote-command
        command: test -f /etc/os-release
      - id: api-ssh
        type: remote-command
        command: systemctl is-active --quiet sshd
      - id: explain-api
        type: text-evidence
        prompt: What does an API provide to a program?
        matches: '(?i)interface|boundary'
  - id: locate-endpoint
    title: Locate the documented interface
    instructions: >-
      Before automating, identify the API interface from your administrator's
      documentation and confirm which actions your learning exercise is meant
      to discuss. Do not copy connection details into course notes.
    verifications:
      - id: reviewed-endpoint-guidance
        type: manual-confirmation
        prompt: Confirm that you reviewed the endpoint guidance.
