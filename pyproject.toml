[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learnlab"
version = "0.1.0"
description = "LearnLab command-line interface"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.16,<1",
    "httpx>=0.28,<1",
    "PyYAML>=6.0,<7",
    "platformdirs>=4.3,<5",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]

[project.scripts]
learnlab = "learnlab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/learnlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: marks tests that require live infrastructure",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
